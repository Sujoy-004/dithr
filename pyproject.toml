[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dithr"
version = "2.0.0"
description = "dithr: Real-time retro visual transformations and high-fidelity media export studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ascii", "video", "dither", "retro", "shaders", "webgpu", "export", "studio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Display",
]

# The application backend is FastAPI; FFmpeg is an external server-side executable.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio", "pyyaml", "mypy>=1.0", "ruff>=0.1", "schemathesis>=3.30", "hypothesis"]

[project.urls]
Homepage = "https://dithr.pages.dev"
Source = "https://github.com/Sujoy-004/ASCII"
Issues = "https://github.com/Sujoy-004/ASCII/issues"

[tool.setuptools]
# Required, not decorative: without it setuptools flat-layout auto-discovery
# cannot tell the `src` directory from top-level py-modules and silently
# installs main.py/config.py/video.py/... into site-packages root.
packages = ["src"]

[tool.pytest.ini_options]
# The package lives at the repo root as the import package `src`, so tests
# using `from src.config import ...` need the root on sys.path. `python -m
# pytest` supplies it implicitly, but a bare `pytest` does not -- this makes
# both work, and makes the suite runnable from any directory.
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
# Type-check the package, not the test suite. Deliberately not strict: the
# renderer works in bytes and the tests use duck-typed doubles on purpose.
files = ["src"]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["psutil", "psutil.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
