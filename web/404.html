<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Page not found — dithr</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="font" href="/fonts/archivo-latin.woff2" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/archivo-latin.woff2') format('woff2');
      }
      :root {
        --ink: #0c0d10;
        --hairline: #262932;
        --text: #e9ebf0;
        --muted: #8a8f9c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ink);
        color: var(--text);
        font-family: 'Archivo', system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 520px;
        border-top: 1px solid var(--hairline);
        border-bottom: 1px solid var(--hairline);
        padding: 36px 0;
      }
      h1 {
        margin: 0 0 12px 0;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
      p {
        margin: 0 0 28px 0;
        color: var(--muted);
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 9999px;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
      }
      a.primary {
        background: var(--text);
        color: var(--ink);
      }
      a.secondary {
        border: 1px solid var(--hairline);
        color: var(--text);
      }
      a:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>
        The route you requested does not exist on dithr. Return to the overview or open the browser studio.
      </p>
      <div class="actions">
        <a href="/" class="secondary">Back to overview</a>
        <a href="/studio/" class="primary">Open studio</a>
      </div>
    </main>
  </body>
</html>
